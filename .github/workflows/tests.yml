name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run local regression tests
        run: python -m pytest -m "not integration" -q
